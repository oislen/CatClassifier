name: cat-classifier
services:

    mlflow:
        container_name: mlf
        image: oislen/cat-classifier:latest
        entrypoint: ["uv", "run", "mlflow", "server"]
        command: ["--host", "0.0.0.0", "--port", "5000"]
        environment:
            - MLFLOW_SERVER_ALLOWED_HOSTS=*
        shm_size: 512m
        ports:
            - "5000:5000"
        volumes:
            - mlruns:/home/user/CatClassifier/mlruns
        networks:
            - cat-net
        restart: unless-stopped

    flask:
        container_name: flk
        image: oislen/cat-classifier:latest
        shm_size: 512m
        ports:
            - "5001:5000"
        environment:
            - PARAM_CHECK_GPU=True
            - MLFLOW_TRACKING_URI=http://mlflow:5000
        depends_on:
            - mlflow
        networks:
            - cat-net
        restart: unless-stopped
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]

    jupyter:
        container_name: jpy
        image: oislen/cat-classifier:latest
        entrypoint: ["uv", "run", "jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root"]
        shm_size: 512m
        ports:
            - "8888:8888"
        volumes:
            - E:\GitHub\CatClassifier\.creds:/home/ubuntu/CatClassifier/.creds
            - E:\GitHub\CatClassifier\report:/home/ubuntu/CatClassifier/report
        environment:
            - PARAM_CHECK_GPU=True
        networks:
            - cat-net
        restart: unless-stopped
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]

volumes:
    mlruns:

networks:
    cat-net:
        driver: bridge