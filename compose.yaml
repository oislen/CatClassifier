name: cat-classifier
services:

    mlflow:
        container_name: mlf
        image: oislen/cat-classifier:latest
        entrypoint: ["uv", "run", "mlflow", "server"]
        command: ["--host", "0.0.0.0", "--port", "5000"]
        environment:
            - MLFLOW_SERVER_ALLOWED_HOSTS=*
        shm_size: 512m
        ports:
            - "5000:5000"
        volumes:
            - mlruns:/home/user/CatClassifier/mlruns
        restart: unless-stopped

    flask:
        container_name: flk
        image: oislen/cat-classifier:latest
        shm_size: 512m
        ports:
            - "5001:5000"
        environment:
            - PARAM_CHECK_GPU=True
            - MLFLOW_TRACKING_URI=http://mlflow:5000
        depends_on:
            - mlflow
        restart: unless-stopped
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]

volumes:
    mlruns:
