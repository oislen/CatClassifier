name: cat-classifier
services:

    mlflow:
        container_name: mlf
        image: ghcr.io/mlflow/mlflow@sha256:2cc40b3208991940d824d04f339833a0b69507569012aa5ec545690608602fc0
        entrypoint: ["mlflow", "server"]
        command: [
            "--host", "0.0.0.0",
            "--port", "5000",
            "--backend-store-uri", "sqlite:////mlflow/mlflow.db",
            "--default-artifact-root", "/mlflow/artifacts"
        ]
        environment:
            - MLFLOW_SERVER_ALLOWED_HOSTS=*
        shm_size: 512m
        ports:
            - "5000:5000"
        networks:
            - cat-net
        restart: unless-stopped

    flask:
        container_name: flk
        image: oislen/cat-classifier:latest
        shm_size: 512m
        ports:
            - "5001:5000"
        environment:
            - PARAM_CHECK_GPU=True
            - MLFLOW_TRACKING_URI=http://mlflow:5000
        depends_on:
            - mlflow
        networks:
            - cat-net
        restart: unless-stopped
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]

    jupyter:
        container_name: jpy
        image: oislen/cat-classifier:latest
        entrypoint: ["uv", "run", "jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root"]
        shm_size: 512m
        ports:
            - "8888:8888"
        environment:
            - PARAM_CHECK_GPU=True
        networks:
            - cat-net
        restart: unless-stopped
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]

volumes:
    mlruns:

networks:
    cat-net:
        driver: bridge