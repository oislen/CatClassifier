name: Post Image Checks
permissions:
  contents: read

on:
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Deployment Workflow"]
    types:
      - completed

jobs:

  check-push-occurred:
    name: Check if Image Was Pushed
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.verify-push.outputs.pushed }}
    steps:
      - name: Verify Dockerhub Image Push job success
        id: verify-push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          REPO="${{ github.repository }}"
          echo "Checking jobs for workflow run ID: $RUN_ID in repo: $REPO"
          # Query GitHub API for the jobs in the triggering workflow run
          JOBS_JSON="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate)"
          # Find the conclusion of the 'Dockerhub Image Push' job
          CONCLUSION="$(echo "$JOBS_JSON" | jq -r '.jobs[] | select(.name == "Dockerhub Image Push") | .conclusion // "skipped"')"
          echo "Dockerhub Image Push job conclusion: $CONCLUSION"
          if [ "$CONCLUSION" == "success" ]; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

  trivy-image-scan:
    name: Trivy Image Scan
    needs: check-push-occurred
    if: needs.check-push-occurred.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Run Trivy vulnerability scanner to show all vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        image-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO }}:latest
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
    - name: Fail build on High or Critical vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        image-ref: ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPO }}:latest
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
