name: Development Workflow
permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    branches: [ dev, main ]

# Cancel outdated runs on the same branch when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Match your regex pattern: type(#issue): description
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

  ruff-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run Ruff Checks
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        with:
          version: "0.15.15"

  sonarqube-scan:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Check if SonarQube is Online
        id: check-sonar
        timeout-minutes: 1
        shell: powershell
        run: |
          $ErrorActionPreference = 'SilentlyContinue'
          try {
              $response = Invoke-WebRequest -Uri "${{ secrets.SONAR_HOST_URL }}/api/system/status" -TimeoutSec 5 -UseBasicParsing
              if ($response -and $response.StatusCode -eq 200) {
                  Write-Host "SonarQube is online."
                  echo "online=true" >> $env:GITHUB_OUTPUT
              } else {
                  Write-Host "SonarQube returned non-200 status."
                  echo "online=false" >> $env:GITHUB_OUTPUT
              }
          } catch {
              Write-Host "SonarQube server is offline or unreachable."
              echo "online=false" >> $env:GITHUB_OUTPUT
          }
          # Force the step to exit successfully so downstream steps can evaluate the output flag
          exit 0
      - name: Run SonarQube Scan
        if: steps.check-sonar.outputs.online == 'true'
        timeout-minutes: 5
        env:
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        shell: cmd
        run: |
          sonar-scanner.bat -D"sonar.projectKey=%SONAR_PROJECT_KEY%" -D"sonar.sources=." -D"sonar.host.url=%SONAR_HOST_URL%" -D"sonar.token=%SONAR_TOKEN%"

  trivy-fs-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Run Trivy to show all vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: 'fs'
        scan-ref: '.'
        severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
        exit-code: '0'
    - name: Fail build on High or Critical vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: 'fs'
        scan-ref: '.'
        severity: 'HIGH,CRITICAL'
        exit-code: '1'

  python-unittests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13.11"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set environment variable
      run: echo "GITHUB_ACTIONS_UNITTEST_FLAG=1" >> $GITHUB_ENV
    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install python dependencies
      run: |
        uv sync
    - name: Test with unittest
      run: |
        uv run python -m unittest discover ./webscrapers/unittests/utilities
        uv run python -m unittest discover ./model/unittests/utilities

  zizmor-scan:
    name: Zizmor CI/CD Security Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run zizmor security analysis
        uses: zizmorcore/zizmor-action@effdb35fa7868863f11655db256d9008922fa427
        with:
          advanced-security: false
          annotations: true