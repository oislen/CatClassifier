# =====================================================================
# 1. Required Project Identification
# =====================================================================
sonar.projectKey=CatClassifier
sonar.projectName=CatClassifier
sonar.projectVersion=1.0

# =====================================================================
# 2. Source Code & Analysis Scope
# =====================================================================
# Set source code directories (relative to repository root)
sonar.sources=.

# Exclude generated code, dependencies, virtual environments, and temporary folders
sonar.exclusions=\
  **/*.creds/**,\
  **/*.ipynb_checkpoints/**,\
  **/.kilo/**,\
  **/.ruff_cache/**,\
  **/.scannerwork/**,\
  **/.venv/**,\
  **/venv/**,\
  **/data/**

# =====================================================================
# 3. Test Files Configuration
# =====================================================================
# Explicitly identify test sources so SonarQube applies test-specific rules
sonar.tests=\
    model/unittests,\
    webscrapers/unittests

# Pattern to identify test files
sonar.test.inclusions=\
    model/unittests/**/test_*.py,\
    webscrapers/unittests/**/test_*.py

# Exclude test files from general source code maintainability metrics
sonar.coverage.exclusions=\
    model/unittests/**,\
    webscrapers/unittests/**

# =====================================================================
# 4. Code Coverage Integration (Coverage.py / Pytest-Cov)
# =====================================================================
# Path to XML coverage report generated by Python coverage tools
sonar.python.coverage.reportPaths=coverage.xml

# =====================================================================
# 5. External Linter Integration (Ruff Integration)
# =====================================================================
# Ingest Ruff linting reports directly into SonarQube maintainability issues
# (Generate with: uv run ruff check --output-format=gitlab > ruff-report.json)
# sonar.python.ruff.reportPaths=ruff-report.json

# =====================================================================
# 6. Global Issue Exclusions (Fine-Grained Ignores)
# =====================================================================
# Example: Ignore specific rule (e.g., class naming regex) in unittest folder
# sonar.issue.ignore.multicriteria=e1
# sonar.issue.ignore.multicriteria.e1.ruleKey=python:S101
# sonar.issue.ignore.multicriteria.e1.resourceKey=generator/unittests/**